// Top-level build file.

ext {
    compileSdkVersion = 36
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.10.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}

tasks.register('debugJava') {
    dependsOn ':app:assembleDebug', ':relay-java:assembleDebug'
}
tasks.register('releaseJava') {
    dependsOn ':app:assembleRelease', ':relay-java:assembleRelease'
}
tasks.register('debugRust') {
    dependsOn ':app:assembleDebug', ':relay-rust:debug'
}
tasks.register('releaseRust') {
    dependsOn ':app:assembleRelease', ':relay-rust:release'
}
tasks.register('releaseRustWindows') {
    dependsOn ':app:assembleRelease', ':relay-rust:releaseCrossToWindows'
}
tasks.register('debugAll') {
    dependsOn 'debugJava', 'debugRust'
}
tasks.register('releaseAll') {
    dependsOn 'releaseJava', 'releaseRust'
}
tasks.register('checkJava') {
    dependsOn ':app:check', ':relay-java:check'
}
tasks.register('checkRust') {
    dependsOn ':app:check', ':relay-rust:check'
}
tasks.register('checkAll') {
    dependsOn 'checkJava', 'checkRust'
}
